<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספירת הקולות 2026 – חי</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6fa;color:#1a1a2e;text-align:right}
header{background:#1d3557;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header img{width:44px;height:44px;border-radius:50%;background:#fff}h1{font-size:19px;margin:0}
.w{padding:12px;max-width:640px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g div{background:#eef2f8;border-radius:8px;padding:8px}.g b{display:block;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid #eee}th{background:#eef2f8}
td.n{text-align:left;direction:ltr}.th td{border-top:3px dashed #e63946;color:#e63946;font-weight:bold;text-align:center}
.out{color:#888}.bar{height:22px;background:#eee;border-radius:6px;position:relative;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:6px}
.bar s{position:absolute;top:-3px;bottom:-3px;right:50.83%;border-right:2px solid #000}.warn{background:#fff3cd;font-size:13px}small{color:#555}
</style></head><body><header><img src="logo.png" alt="MARINA"><h1>ספירת הקולות – בחירות 2026</h1></header><div class="w" id="app">טוען…</div>
<script>
const B={c:'הקואליציה (ליכוד, ש״ס, יהדות התורה, עוצמה יהודית, הציונות הדתית)',e:'גוש איזנקוט (ישר!, ביחד, ישראל ביתנו, הדמוקרטים)',a:'מפלגות ערביות (המשותפת, רע״ם)'};
const C={c:'#1d4ed8',e:'#16a34a',a:'#9333ea'};const f=n=>n.toLocaleString('he-IL');
const R='bronfmanmarina15620-crypto/elections-2026-live';
async function get(f){const u=['https://api.github.com/repos/'+R+'/contents/'+f+'?ref=main&t='+Date.now(),'https://raw.githubusercontent.com/'+R+'/main/'+f+'?t='+Date.now(),f+'?t='+Date.now()];
for(let i=0;i<u.length;i++){try{const r=await fetch(u[i],{cache:'no-store',headers:i==0?{Accept:'application/vnd.github.raw'}:{}});if(r.ok)return await r.json()}catch(e){}}throw 1}
let next=0;setInterval(()=>{const s=Math.max(0,Math.round((next-Date.now())/1000));const e=document.getElementById('cd');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
async function load(){next=Date.now()+300000;try{const d=await get('data.json');let st={},hi=[];try{st=await get('status.json')}catch(e){}try{hi=await get('history.json')}catch(e){}const tm=hi.map(x=>x.split(', ')[1]||x);const mins=tm.map(t=>{const[a,b]=t.split(':');return +a*60+ +b});const avg=mins.length>1?Math.round((mins[mins.length-1]-mins[0])/(mins.length-1)):null;const ck=(st.checked||d.fetched).split(' ')[1];
let h0=`<div class="card" style="background:#1d3557;color:#fff;font-size:17px"><div>🟢 נבדק לאחרונה: <b>${ck}</b></div><div>🗳️ עדכון אחרון של ועדת הבחירות: <b>${d.asof.split(', ')[1]||d.asof}</b></div><div style="font-size:13px;opacity:.85;margin-top:4px">ועדת הבחירות מעדכנת בקצב שלה – אם המספרים לא זזים, זה כי עוד לא פורסם עדכון חדש.</div><div style="margin-top:6px">🔄 מתעדכן מיד כשהוועדה מעדכנת</div>${avg?`<div>הוועדה מעדכנת בממוצע כל ~${avg} דקות (לפי העדכונים עד עכשיו)</div>`:""}<div style="font-size:13px;opacity:.85">עדכוני הוועדה: ${tm.join(" · ")}</div><div style="font-size:13px;opacity:.85">⏱️ הדף יבדוק שוב בעוד <b id="cd">5:00</b></div></div>`;
let h=h0+`<div class="card warn">⚠️ <b>הערכה מספירה חלקית.</b> המנדטים מחושבים אצלי בשיטת בדר־עופר עם 5 הסכמי העודפים שנחתמו, מתוך הקולות שנספרו עד עכשיו. התוצאה הרשמית רק מוועדת הבחירות (עד 4.11).</div>
<div class="card g"><div>קולות שנספרו<b>${f(d.counted)}</b></div><div>בעלי זכות בחירה<b>${f(d.eligible)}</b></div>
<div>נספרו מתוך בעלי זכות בחירה<b>${d.pct_counted}%</b></div><div>עדכון במקור<b>${d.asof}</b></div></div><div class="card"><b>גושים מול 61</b>`;
for(const k of 'cea'){const s=d.blocs[k];h+=`<div><small>${B[k]}</small> – <b>${s}</b>${s>=61?' ✅':''}</div><div class="bar"><i style="width:${s/120*100}%;background:${C[k]}"></i><s></s></div>`}
h+=`<small>הנדל–זליכה ווינטר מחוץ לגושים. הקו השחור = 61.</small></div><div class="card"><table><tr><th>מפלגה</th><th>קולות</th><th>%</th><th>מנדטים</th></tr>`;
let line=false;for(const p of d.parties){if(!line&&p.pct<3.25){line=true;h+=`<tr class="th"><td colspan="4">אחוז החסימה 3.25% (${f(d.threshold_votes)} קולות)</td></tr>`}
h+=`<tr class="${p.pct<3.25?'out':''}"><td>${p.name}</td><td class="n">${f(p.votes)}</td><td class="n">${p.pct}</td><td class="n"><b>${p.seats}</b></td></tr>`}
h+=`<tr class="out"><td>כל שאר הרשימות</td><td class="n">${f(d.others)}</td><td></td><td></td></tr></table></div>
<div class="card"><small>מקור הנתונים: <a href="${d.source}">${d.source_label}</a>. אתר ועדת הבחירות הרשמי (<a href="https://votes26.bechirot.gov.il/nationalresults?lang=he">votes26.bechirot.gov.il</a>) חוסם משיכה אוטומטית, לכן הנתונים מגיעים מאתר שמציג את נתוני הוועדה. הסכמי עודפים: <a href="https://www.ynet.co.il/news/elections2026/article/hjextlj2gl">ynet</a>. נבדק לאחרונה: ${d.fetched}.</small></div>`;
document.getElementById('app').innerHTML=h}catch(e){document.getElementById('app').textContent='שגיאה בטעינה, מנסה שוב בעוד 5 דקות'}}
load();setInterval(load,300000);
</script></body></html>
